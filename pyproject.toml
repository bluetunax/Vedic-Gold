[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vedic-engine"
version = "1.0.0"
description = "From-scratch sidereal (Jyotisa / Vedic) astrology engine in pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []          # core engine + stdlib API server need nothing extra

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
vedic-chart = "vedic_engine.__main__:main"

[tool.setuptools]
packages = ["vedic_engine", "api"]

[tool.setuptools.package-data]
vedic_engine = ["data/*.json"]
